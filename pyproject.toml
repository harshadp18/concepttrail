[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "concepttrail"
version = "0.1.0"
description = "Adaptive, curriculum-grounded learning platform for CBSE Classes 6-10"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "pgvector>=0.3,<1",
  "networkx>=3.3,<4",
]

[project.optional-dependencies]
pipeline = [
  "PyMuPDF>=1.24,<2",
  "pandas>=2.2,<4",
  "PyYAML>=6.0,<7",
]
llm = [
  "google-genai>=1,<2",
  "groq>=0.11,<2",
]
math = [
  "sympy>=1.13,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.7,<1",
  "coverage>=7,<8",
]

[tool.setuptools.packages.find]
include = ["app*", "data_pipeline*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
