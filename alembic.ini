# Alembic configuration for ConceptTrail.
#
# There is deliberately no `sqlalchemy.url` here. `app/db/migrations/env.py` takes the
# database URL from the validated application settings: the root `.env`, overridden by
# a `DATABASE_URL` process environment variable (used for disposable test databases).
# Credentials therefore never appear in this file, in logs or in generated SQL.
#
# Read app/db/migrations/README.md before running any command that touches a real
# database. `upgrade`, `downgrade` and `stamp` against the owner's database require the
# owner's explicit approval and a verified backup.

[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os

# Revision IDs are a zero-padded sequence (`--rev-id 0002`); files are `<rev>_<slug>.py`.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC

# Fail fast if a revision file cannot be imported while listing history.
revision_environment = false

[post_write_hooks]
# Keep generated revisions lint-clean; review the result by hand before committing.
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# Keep at WARNING: INFO would echo SQL statements.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
